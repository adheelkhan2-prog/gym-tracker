# Scrolls the workout down until the element with id ${ID} is centred on screen. Maestro swipes from
# the middle of the screen, which on the workout is usually over the set rows' weight/reps boxes:
# this proves a swipe that starts on the boxes scrolls the workout.
appId: com.gymtracker.app
---
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: DOWN
    centerElement: true
    timeout: 30000
