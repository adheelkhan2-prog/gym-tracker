# Two passes of the crash-test chain in a single Maestro run (to debug flows that only fail when
# they follow others).
appId: com.gymtracker.app
---
- repeat:
    times: 2
    commands:
      - runFlow: nav.yaml
      - runFlow: start.yaml
      - runFlow: log.yaml
      - runFlow: scroll.yaml
      - runFlow: swap.yaml
      - runFlow: finish.yaml
