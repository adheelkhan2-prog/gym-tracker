# Log one set, go to the last exercise, Finish workout, the celebration screen (3D model), Done, back on Today.
appId: com.gymtracker.app
---
- runFlow: ../lib/begin-workout.yaml
- runFlow:
    file: ../lib/type-weight.yaml
    env: { CARD: "0", SET: "0", WEIGHT: "40" }
- runFlow:
    file: ../lib/log-set.yaml
    env: { CARD: "0", SET: "0", COUNT: "1" }
- repeat:
    while:
      notVisible:
        id: "finish-workout"
    commands:
      - tapOn:
          id: "next-exercise"
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    id: "finish-workout"
- extendedWaitUntil:
    visible: ".* · done"
    timeout: 20000
- runFlow: ../lib/no-errors.yaml
# The 3D model once its intro has played: the trained upper body must be fully in view.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: shot-complete
# Done is the last thing on the page: plain swipes from mid-screen until it shows (scrollUntilVisible
# threw inside Maestro here, and a swipe from the bottom edge can be taken as the Home gesture).
- repeat:
    while:
      notVisible:
        id: "complete-done"
    times: 8
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 25%
          duration: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "complete-done"
- extendedWaitUntil:
    visible: "Today"
    timeout: 20000
- runFlow: ../lib/no-errors.yaml
