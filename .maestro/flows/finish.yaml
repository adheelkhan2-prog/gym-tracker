# Log one set, Finish workout, the celebration screen (3D model), Done, back on Today.
appId: com.gymtracker.app
---
- runFlow: ../lib/begin-workout.yaml
- runFlow:
    file: ../lib/type-weight.yaml
    env: { CARD: "0", SET: "0", WEIGHT: "40" }
- runFlow:
    file: ../lib/log-set.yaml
    env: { CARD: "0", SET: "0", COUNT: "1" }
- runFlow:
    file: ../lib/scroll-to.yaml
    env:
      ID: "finish-workout"
- tapOn:
    id: "finish-workout"
- extendedWaitUntil:
    visible: ".* · done"
    timeout: 20000
- runFlow: ../lib/no-errors.yaml
# Done is the last thing on the page: scroll down to it (it can't be centred).
- scrollUntilVisible:
    element:
      id: "complete-done"
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "complete-done"
- extendedWaitUntil:
    visible: "Today"
    timeout: 20000
- runFlow: ../lib/no-errors.yaml
