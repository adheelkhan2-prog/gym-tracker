# Swap the second exercise to an alternative, then log a set on it.
appId: com.gymtracker.app
---
- runFlow: ../lib/begin-workout.yaml
- runFlow:
    file: ../lib/scroll-to.yaml
    env:
      ID: "swap-1"
- tapOn:
    id: "swap-1"
- extendedWaitUntil:
    visible:
      id: "swap-option-.*"
    timeout: 10000
- tapOn:
    id: "swap-option-.*"
    index: 1
- runFlow: ../lib/no-errors.yaml
- runFlow:
    file: ../lib/log-set.yaml
    env: { CARD: "1", SET: "0", WEIGHT: "30", COUNT: "1" }
