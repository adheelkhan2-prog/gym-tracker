# The crash test: every flow once, each from a fresh install (raise `times` for a longer soak).
appId: com.gymtracker.app
---
- repeat:
    times: 1
    commands:
      - runFlow: nav.yaml
      - runFlow: start.yaml
      - runFlow: log.yaml
      - runFlow: scroll.yaml
      - runFlow: page.yaml
      - runFlow: swap.yaml
      - runFlow: calendar.yaml
      - runFlow: finish.yaml
