# The crash test: every flow 3 times over, each from a fresh install (repeats catch leaks, e.g. of
# video players, that one pass would miss).
appId: com.gymtracker.app
---
- repeat:
    times: 3
    commands:
      - runFlow: nav.yaml
      - runFlow: start.yaml
      - runFlow: log.yaml
      - runFlow: stepper.yaml
      - runFlow: scroll.yaml
      - runFlow: page.yaml
      - runFlow: swap.yaml
      - runFlow: calendar.yaml
      - runFlow: finish.yaml
