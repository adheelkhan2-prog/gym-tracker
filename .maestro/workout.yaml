# Full workout on a real Android release build, 10 times from a fresh install each time:
# start today's workout (or train another day on a rest day), Log-set validation, log sets, skip
# rest, swap an exercise, finish, celebration screen, back to Today. Any error screen fails the run.
appId: com.gymtracker.app
---
- repeat:
    times: 10
    commands:
      - launchApp:
          clearState: true
      - runFlow: system-dialogs.yaml
      - extendedWaitUntil:
          visible: "Today"
          timeout: 120000
      - runFlow: no-errors.yaml
      # Rest day (weekend): preview Monday and train it today.
      - runFlow:
          when:
            notVisible: "Start workout"
          commands:
            - tapOn:
                text: "Monday.*"
            - tapOn: "Train .* today"
      - runFlow:
          when:
            visible: "Start workout"
          commands:
            - tapOn: "Start workout"
      - extendedWaitUntil:
          visible:
            id: "exercise-0"
          timeout: 20000
      - runFlow:
          file: scroll-to.yaml
          env:
            ID: "log-0-1"
      - runFlow: no-errors.yaml
      # Log-set validation: first time there is no weight yet, so logging must ask for it.
      - runFlow:
          when:
            visible:
              id: "weight-0-0"
          commands:
            - tapOn:
                id: "log-0-0"
            - assertVisible: "Add your .* first"
            - tapOn:
                id: "weight-0-0"
            - inputText: "40"
            - hideKeyboard
      - tapOn:
          id: "log-0-0"
      - extendedWaitUntil:
          visible: "1 of .* sets"
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: "rest-skip"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: "rest-skip"
          commands:
            - tapOn:
                id: "rest-skip"
      # Second set reuses the first set's numbers: one tap. (No hideKeyboard here: logging already
      # closed the keyboard, and on Android hideKeyboard with no keyboard open presses Back.)
      - runFlow:
          file: scroll-to.yaml
          env:
            ID: "log-0-1"
      - tapOn:
          id: "log-0-1"
      - extendedWaitUntil:
          visible: "2 of .* sets"
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: "rest-skip"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: "rest-skip"
          commands:
            - tapOn:
                id: "rest-skip"
      - runFlow: no-errors.yaml
      # Scroll test: a swipe that starts ON a set row's box must scroll the workout. Set 2 was just
      # centred, so 58% down / 60% across is set 3's reps box. Two swipes from there must carry
      # set 2 off the screen.
      - assertVisible:
          id: "reps-0-2"
      - swipe:
          start: 60%, 58%
          end: 60%, 18%
          duration: 500
      - swipe:
          start: 60%, 58%
          end: 60%, 18%
          duration: 500
      - assertNotVisible:
          id: "log-0-1"
      # Swap the second exercise to its first alternative (or back to the original).
      - runFlow:
          file: scroll-to.yaml
          env:
            ID: "swap-1"
      - tapOn:
          id: "swap-1"
      - extendedWaitUntil:
          visible:
            id: "swap-option-.*"
          timeout: 10000
      - tapOn:
          id: "swap-option-.*"
          index: 1
      - runFlow: no-errors.yaml
      # Log one set on the swapped exercise.
      - runFlow:
          when:
            visible:
              id: "weight-1-0"
          commands:
            - tapOn:
                id: "weight-1-0"
            - inputText: "30"
            - hideKeyboard
      - runFlow:
          file: scroll-to.yaml
          env:
            ID: "log-1-0"
      - tapOn:
          id: "log-1-0"
      - extendedWaitUntil:
          visible: "3 of .* sets"
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: "rest-skip"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: "rest-skip"
          commands:
            - tapOn:
                id: "rest-skip"
      # Finish: saved first, then the celebration.
      - runFlow:
          file: scroll-to.yaml
          env:
            ID: "finish-workout"
      - tapOn:
          id: "finish-workout"
      - extendedWaitUntil:
          visible: ".* · done"
          timeout: 20000
      - runFlow: no-errors.yaml
      # Done sits in a fixed footer: wait for it, no scrolling.
      - extendedWaitUntil:
          visible:
            id: "complete-done"
          timeout: 30000
      - tapOn:
          id: "complete-done"
      - extendedWaitUntil:
          visible: "Today"
          timeout: 20000
      - runFlow: no-errors.yaml
