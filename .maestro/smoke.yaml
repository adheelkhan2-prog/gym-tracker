# Crash smoke test on a real Android release build (see .github/workflows/android-e2e.yml).
# Every screen visit asserts the app is still up and no error panel is showing.
appId: com.gymtracker.app
---
- launchApp:
    clearState: true
# First cold start after a fresh install is slow on the emulator.
- runFlow: system-dialogs.yaml
- extendedWaitUntil:
    visible: "Today"
    timeout: 120000
- runFlow: no-errors.yaml
- repeat:
    times: 10
    commands:
      - tapOn:
          id: "tab-settings"
      - runFlow: no-errors.yaml
      - tapOn:
          id: "tab-index"
      - runFlow: no-errors.yaml
      - tapOn:
          id: "tab-supplements"
      - runFlow: no-errors.yaml
      - tapOn:
          id: "tab-index"
      - runFlow: no-errors.yaml
      - tapOn:
          id: "tab-progress"
      - runFlow: no-errors.yaml
      - tapOn:
          id: "tab-index"
      - runFlow: no-errors.yaml
