# Fresh install state, app open on Today.
appId: com.gymtracker.app
---
- launchApp:
    clearState: true
- runFlow: system-dialogs.yaml
- extendedWaitUntil:
    visible: "Today"
    timeout: 120000
# First launch asks to keep the rest timer on time (battery optimisation): not now.
- extendedWaitUntil:
    visible:
      id: "rest-setup-close"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible:
        id: "rest-setup-close"
    commands:
      - tapOn:
          id: "rest-setup-close"
          # The sheet slides away on the first tap; a retry would land on the tab bar under it.
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow: no-errors.yaml
