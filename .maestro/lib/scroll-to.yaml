# Scroll the workout until element ${ID} is centred. Maestro swipes from the middle of the screen,
# usually over the set rows' boxes, so this also proves swipes that start on the boxes scroll.
appId: com.gymtracker.app
---
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: DOWN
    centerElement: true
    timeout: 30000
# On Android a touch on a still-moving list only stops it: let it settle before tapping.
- waitForAnimationToEnd:
    timeout: 3000
