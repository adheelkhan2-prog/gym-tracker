name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk gym-tracker-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-apk
          path: gym-tracker-${{ github.run_number }}.apk
      # A release gives a direct download link that opens on the phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "gym-tracker-${{ github.run_number }}.apk" \
            --title "Gym Tracker build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download the APK on your Android phone and open it to install." \
            --latest
